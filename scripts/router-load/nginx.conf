upstream replicas {
    server replica-a:8080;
    server replica-b:8080;
    keepalive 32;
}

server {
    listen 80;
    access_log off;
    location / {
        proxy_pass http://replicas;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_next_upstream off;
    }
}
